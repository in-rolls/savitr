[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project]
name = "savitr"
version = "0.3.0"
description = "Fast Surya OCR on Apple Silicon for Indian electoral rolls (MLX runtime + a distilled terse roll model)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "in-rolls" }]
keywords = ["ocr", "surya", "mlx", "apple-silicon", "electoral-roll", "india", "vlm", "distillation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
dependencies = [
    "mlx-vlm>=0.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "pdf2image>=1.16",
    "pillow>=12.1.1",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
train = ["transformers>=5.12", "peft>=0.11", "accelerate>=0.30", "torch>=2.2"]

[project.scripts]
savitr = "savitr.cli:main"

[project.urls]
Homepage = "https://github.com/in-rolls/savitr"
Repository = "https://github.com/in-rolls/savitr"
Issues = "https://github.com/in-rolls/savitr/issues"
Documentation = "https://in-rolls.github.io/savitr/"
Model = "https://huggingface.co/gojiberries/savitr"

[tool.uv.build-backend]
module-name = "savitr"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not live"]
markers = ["live: reaches Hugging Face and is deselected by default"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "training",
    "bench",
    ".venv*",
    "build",
    "dist",
    "_build",
    "_site",
    "_doctest",
]

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300", "D105", "D107", "E741"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]
"src/savitr/rolls/fields.py" = ["E501", "D"]

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'
[dependency-groups]
docs = [
    "sphinx>=8",
    "py-canon @ git+https://github.com/gojiplus/py-canon@v1",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
]
test = ["pytest>=8", "pytest-cov>=6"]
dev = [
    "ruff>=0.16",
    "pyright>=1.1.390",
    "pre-commit>=4",
    "pydoclint>=0.5",
    { include-group = "test" },
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["src"]

[tool.codespell]
skip = "corpus/*,corpus_*/*,models/*,pages/*,kernel/*,kernel_*/*,docs/_build/*,_site/*,_doctest/*,dist/*,*.json,*.jsonl"
